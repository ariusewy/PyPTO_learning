site_name: PyPTO 学习文档
site_description: PyPTO 编译器学习文档 - 整合 pypto、pto-as、pto-isa 三个项目的中文文档
site_author: PyPTO Learner

# 主题配置
theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/git-alt

# Markdown 扩展
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      slugify: !!python/name:pymdownx.slugs.uslugify
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: pypto
      repo: pypto
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# 额外配置
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pypto
  generator: false

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

# 插件
plugins:
  - search:
      lang:
        - zh
        - en

# 文档目录
docs_dir: docs

# 导航结构
nav:
  - 首页: index.md
  - PyPTO:
    - 概述: pypto/dev/passes/00-pass_manager.md
    - Pass 文档:
      - Pass Manager: pypto/dev/passes/00-pass_manager.md
      - UnrollLoops: pypto/dev/passes/01-unroll_loops.md
      - CtrlFlowTransform: pypto/dev/passes/02-ctrl_flow_transform.md
      - ConvertToSSA: pypto/dev/passes/03-convert_to_ssa.md
      - FlattenCallExpr: pypto/dev/passes/04-flatten_call_expr.md
      - SplitChunkedLoops: pypto/dev/passes/05-split_chunked_loops.md
      - InterchangeChunkLoops: pypto/dev/passes/06-interchange_chunk_loops.md
      - OutlineIncoreScopes: pypto/dev/passes/07-outline_incore_scopes.md
      - OutlineClusterScopes: pypto/dev/passes/08-outline_cluster_scopes.md
      - FlattenTileNdTo2D: pypto/dev/passes/10-flatten_tile_nd_to_2d.md
      - InitMemRef: pypto/dev/passes/12-init_memref.md
      - MemoryReuse: pypto/dev/passes/15-memory_reuse.md
      - InsertSync: pypto/dev/passes/14-insert_sync.md
      - Utility Passes: pypto/dev/passes/16-utility_passes.md
      - Verifier: pypto/dev/passes/99-verifier.md
    - IR 文档:
      - IR 概述: pypto/dev/ir/00-overview.md
      - 层级结构: pypto/dev/ir/01-hierarchy.md
      - 类型系统: pypto/dev/ir/02-types.md
      - 结构对比: pypto/dev/ir/03-structural_comparison.md
      - 序列化: pypto/dev/ir/04-serialization.md
      - 操作符: pypto/dev/ir/05-operators.md
