name: Update Submodules

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update submodules to latest
        run: |
          git submodule update --remote --merge pypto
          git submodule update --remote --merge pto-as
          git submodule update --remote --merge pto-isa

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pypto pto-as pto-isa
          if git diff --cached --quiet; then
            echo "No submodule changes to commit."
          else
            git commit -m "chore: update sub-repos (pypto, pto-as, pto-isa)"
            git push
          fi
